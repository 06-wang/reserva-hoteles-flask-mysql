# Este archivo configura Nginx para servir el frontend estático y reenviar las peticiones de la ruta /api/ al servicio backend.
# Su función principal es actuar como servidor web para los archivos del cliente y como proxy inverso para la API.

# Inicia la definición de un servidor virtual de Nginx.
server {
    # Indica que Nginx escuchará las peticiones HTTP que lleguen al puerto 80.
    listen 80;
    
    # Define la configuración para las peticiones dirigidas a la raíz del sitio.
    location / {
        # Establece la carpeta del contenedor desde la que se servirán los archivos estáticos.
        root /usr/share/nginx/html;
        # Indica que el archivo principal por defecto será index.html.
        index index.html;
    }

    # Define la configuración para todas las peticiones que empiecen por /api/.
    location /api/ {
        # Recuerda que el nombre "backend" debe coincidir con el nombre del servicio definido en docker-compose.
        # Reenvía las peticiones de /api/ al servidor backend que escucha en el puerto 5000.
        proxy_pass http://backend:5000;
        # Envía al backend la cabecera Host original de la petición recibida por Nginx.
        proxy_set_header Host $host;
        # Envía al backend la dirección IP real del cliente que hizo la petición.
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Cierra la definición del servidor virtual.
}
